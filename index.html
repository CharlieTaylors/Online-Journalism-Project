<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Journalism Asm1 Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f7f7f5;
  color: #292929;
}

.container {
  width: 94%;
  max-width: 1250px;
  margin: 45px auto;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

.header h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  color: #888;
  font-size: 14px;
  margin-top: 5px;
}

.add-btn {
  background: #2f3437;
  color: white;
  border: none;
  padding: 11px 17px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 600;
}

/* SECTION */

.section {
  background: white;
  border-radius: 9px;
  margin-bottom: 25px;
  border: 1px solid #ececec;
  overflow: hidden;
}

.section-header {
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  background: #fafafa;
}

.section-title-area {
  display: flex;
  align-items: center;
  gap: 8px;
}

.arrow {
  font-size: 12px;
  color: #777;
  transition: 0.2s;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
}

.task-count {
  font-size: 11px;
  color: #999;
}

.section-progress {
  font-size: 11px;
  color: #999;
}

.section-content {
  overflow-x: auto;
}

/* TABLE */

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 680px;
}

th {
  text-align: left;
  padding: 12px 18px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #8b8b8b;
  font-weight: 600;
  border-bottom: 1px solid #eee;
}

td {
  padding: 14px 18px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
}

tr:last-child td {
  border-bottom: none;
}

.task-name {
  font-weight: 600;
  margin-bottom: 3px;
}

.task-label {
  color: #aaa;
  font-size: 10px;
}

/* DATE */

.date-main {
  display: inline-block;
  margin-right: 7px;
}

.deadline-badge {
  display: inline-block;
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 10px;
  white-space: nowrap;
}

.overdue {
  background: #fde8e7;
  color: #b64c46;
}

.due-soon {
  background: #fff2d5;
  color: #8c6a22;
}

.due-normal {
  background: #f1f1ef;
  color: #777;
}

.done-date {
  background: #e8f3ea;
  color: #4d7655;
}

/* STATUS */

.status {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 11px;
  white-space: nowrap;
}

.not-started {
  background: #eeeeec;
  color: #666;
}

.in-progress {
  background: #fff0bd;
  color: #7c621b;
}

.completed {
  background: #dfeee2;
  color: #4b7154;
}

/* EDIT */

.edit-btn {
  border: none;
  background: transparent;
  cursor: pointer;
  color: #777;
  font-size: 14px;
}

/* EMPTY */

.empty {
  padding: 25px;
  color: #888;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 460px;
  padding: 25px;
  border-radius: 12px;
}

.modal-box h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 16px;
  margin-bottom: 5px;
  font-size: 12px;
  color: #555;
}

input,
select {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 13px;
}

.modal-buttons {
  display: flex;
  gap: 9px;
  margin-top: 25px;
  justify-content: flex-end;
}

.modal-buttons button {
  padding: 9px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.save-btn {
  background: #2f3437;
  color: white;
}

.cancel-btn {
  background: #eee;
}

.delete-btn {
  background: #fde6e6;
  color: #b23030;
  margin-right: auto;
}

/* MOBILE */

@media(max-width: 700px) {

  .container {
    width: 96%;
    margin-top: 25px;
  }

  .header h1 {
    font-size: 23px;
  }

  .add-btn {
    font-size: 12px;
  }

}

</style>
</head>


<body>

<div class="container">

  <div class="header">

    <div>
      <h1>Online Journalism Asm1</h1>
      <div class="subtitle">
        Assignment Task Tracker
      </div>
    </div>

    <button class="add-btn" onclick="openAddModal()">
      + Add Task
    </button>

  </div>

  <div id="tracker">
    Loading...
  </div>

</div>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">Add Task</h2>

    <label>Department / Section</label>
    <input
      id="department"
      placeholder="e.g. Writing"
    >

    <label>Task</label>
    <input
      id="task"
      placeholder="Task name"
    >

    <label>PIC</label>
    <input
      id="pic"
      placeholder="e.g. Chang Yi, Ashley"
    >

    <label>Date</label>
    <input
      type="date"
      id="due"
    >

    <label>Status</label>

    <select id="status">
      <option>Not Started</option>
      <option>In Progress</option>
      <option>Completed</option>
    </select>


    <div class="modal-buttons">

      <button
        class="delete-btn"
        id="deleteButton"
        onclick="deleteTask()"
        style="display:none"
      >
        Delete
      </button>

      <button
        class="cancel-btn"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="save-btn"
        onclick="saveTask()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
  "AIzaSyDZ3oh1Adjnz_-d5MMJj8vBSWHZQGfkx3I",

  authDomain:
  "online-journalism-asm1.firebaseapp.com",

  projectId:
  "online-journalism-asm1",

  storageBucket:
  "online-journalism-asm1.firebasestorage.app",

  messagingSenderId:
  "742635372867",

  appId:
  "1:742635372867:web:e4b0b33cc5aae5b583aff6",

  measurementId:
  "G-H88Z242G80"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const tasksCollection =
  collection(db, "tasks");


let tasks = [];

let editingID = null;


/* LIVE SYNC */

onSnapshot(
  tasksCollection,

  snapshot => {

    tasks = [];

    snapshot.forEach(item => {

      tasks.push({
        id: item.id,
        ...item.data()
      });

    });

    render();

  },

  error => {

    console.error(error);

    document.getElementById("tracker").innerHTML =
      `<div class="empty">
      Unable to load tasks. Please check Firestore permissions.
      </div>`;

  }
);


/* ADD TASK */

window.openAddModal = function() {

  editingID = null;

  document.getElementById("modalTitle")
    .innerText = "Add Task";

  document.getElementById("deleteButton")
    .style.display = "none";

  document.getElementById("department").value = "";
  document.getElementById("task").value = "";
  document.getElementById("pic").value = "";
  document.getElementById("due").value = "";
  document.getElementById("status").value =
    "Not Started";

  document.getElementById("modal")
    .style.display = "flex";

};


/* EDIT TASK */

window.editTask = function(id) {

  const item =
    tasks.find(task => task.id === id);

  if (!item) return;

  editingID = id;

  document.getElementById("modalTitle")
    .innerText = "Edit Task";

  document.getElementById("deleteButton")
    .style.display = "block";

  document.getElementById("department").value =
    item.department || "";

  document.getElementById("task").value =
    item.task || "";

  document.getElementById("pic").value =
    item.pic || "";

  document.getElementById("due").value =
    item.due || "";

  document.getElementById("status").value =
    item.status || "Not Started";

  document.getElementById("modal")
    .style.display = "flex";

};


/* SAVE */

window.saveTask = async function() {

  const department =
    document
    .getElementById("department")
    .value.trim();

  const task =
    document
    .getElementById("task")
    .value.trim();

  const pic =
    document
    .getElementById("pic")
    .value.trim();

  const due =
    document
    .getElementById("due")
    .value;

  const status =
    document
    .getElementById("status")
    .value;


  if (!task) {

    alert("Please enter a task.");

    return;

  }


  if (!department) {

    alert("Please enter a department / section.");

    return;

  }


  const data = {

    department,
    task,
    pic,
    due,
    status

  };


  try {

    if (editingID) {

      await updateDoc(
        doc(db, "tasks", editingID),
        data
      );

    }

    else {

      data.createdAt =
        serverTimestamp();

      await addDoc(
        tasksCollection,
        data
      );

    }

    closeModal();

  }

  catch(error) {

    console.error(error);

    alert(
      "Unable to save task. Please check Firebase permissions."
    );

  }

};


/* DELETE */

window.deleteTask = async function() {

  if (!editingID)
    return;

  if (!confirm("Delete this task?"))
    return;

  try {

    await deleteDoc(
      doc(db, "tasks", editingID)
    );

    closeModal();

  }

  catch(error) {

    console.error(error);

    alert("Unable to delete task.");

  }

};


/* CLOSE */

window.closeModal = function() {

  document.getElementById("modal")
    .style.display = "none";

  editingID = null;

};


/* CLICK OUTSIDE MODAL */

document
.getElementById("modal")
.addEventListener(
  "click",
  function(event) {

    if (event.target === this)
      closeModal();

  }
);


/* DATE COUNTDOWN */

function getDeadline(dueDate, status) {

  if (!dueDate) {

    return {
      text: "",
      className: ""
    };

  }


  if (status === "Completed") {

    return {
      text: "Completed",
      className: "done-date"
    };

  }


  const today =
    new Date();

  today.setHours(0,0,0,0);


  const due =
    new Date(
      dueDate + "T00:00:00"
    );


  const difference =
    due.getTime() -
    today.getTime();


  const days =
    Math.round(
      difference /
      (1000 * 60 * 60 * 24)
    );


  if (days < 0) {

    return {

      text:
        "⚠ " +
        Math.abs(days) +
        "d overdue",

      className:
        "overdue"

    };

  }


  if (days === 0) {

    return {

      text:
        "⚠ Due today",

      className:
        "overdue"

    };

  }


  if (days <= 3) {

    return {

      text:
        "⌛ Due in " +
        days +
        "d",

      className:
        "due-soon"

    };

  }


  return {

    text:
      "Due in " +
      days +
      "d",

    className:
      "due-normal"

  };

}


/* FORMAT DATE */

function formatDate(dateString) {

  if (!dateString)
    return "—";


  const date =
    new Date(
      dateString + "T00:00:00"
    );


  return date.toLocaleDateString(
    "en-GB",

    {
      day: "2-digit",
      month: "2-digit"
    }

  );

}


/* STATUS STYLE */

function statusClass(status) {

  if (status === "Completed")
    return "completed";

  if (status === "In Progress")
    return "in-progress";

  return "not-started";

}


/* SAFE TEXT */

function escapeHTML(value) {

  return String(value || "")

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* COLLAPSE SECTION */

window.toggleSection = function(id) {

  const element =
    document.getElementById(id);

  if (
    element.style.display === "none"
  ) {

    element.style.display = "block";

  }

  else {

    element.style.display = "none";

  }

};


/* RENDER */

function render() {

  const tracker =
    document.getElementById("tracker");


  if (tasks.length === 0) {

    tracker.innerHTML =
      `<div class="empty">
      No tasks yet. Click <b>+ Add Task</b> to start.
      </div>`;

    return;

  }


  /* SORT */

  tasks.sort((a,b) => {

    if (!a.due) return 1;

    if (!b.due) return -1;

    return a.due.localeCompare(b.due);

  });


  /* GROUP BY DEPARTMENT */

  const departments = {};


  tasks.forEach(item => {

    const department =
      item.department ||
      "General";


    if (!departments[department]) {

      departments[department] = [];

    }


    departments[department]
      .push(item);

  });


  tracker.innerHTML = "";


  Object.keys(departments)
  .forEach((department, index) => {

    const sectionTasks =
      departments[department];


    const completed =
      sectionTasks.filter(
        task =>
        task.status === "Completed"
      ).length;


    const percentage =
      Math.round(
        completed /
        sectionTasks.length *
        100
      );


    const contentID =
      "section-" + index;


    const section =
      document.createElement("div");


    section.className =
      "section";


    section.innerHTML = `

      <div
        class="section-header"
        onclick="toggleSection('${contentID}')"
      >

        <div class="section-title-area">

          <span class="arrow">
            ▾
          </span>

          <span class="section-title">
            ${escapeHTML(department)}
          </span>

          <span class="task-count">
            ${sectionTasks.length}
            ${sectionTasks.length === 1
              ? "task"
              : "tasks"}
          </span>

        </div>


        <div class="section-progress">

          ${percentage}%

        </div>

      </div>


      <div
        class="section-content"
        id="${contentID}"
      >

        <table>

          <thead>

            <tr>

              <th style="width:38%">
                TASK
              </th>

              <th style="width:22%">
                PIC
              </th>

              <th style="width:22%">
                DATES
              </th>

              <th style="width:15%">
                STATUS
              </th>

              <th style="width:3%">
              </th>

            </tr>

          </thead>


          <tbody>

          ${sectionTasks.map(item => {

            const deadline =
              getDeadline(
                item.due,
                item.status
              );


            return `

              <tr>

                <td>

                  <div class="task-name">

                    ${escapeHTML(
                      item.task
                    )}

                  </div>

                  <div class="task-label">

                    Deadline

                  </div>

                </td>


                <td>

                  ${escapeHTML(
                    item.pic || "—"
                  )}

                </td>


                <td>

                  <span class="date-main">

                    ${formatDate(
                      item.due
                    )}

                  </span>


                  ${
                    deadline.text
                    ?
                    `<span
                      class="deadline-badge
                      ${deadline.className}"
                    >
                      ${deadline.text}
                    </span>`
                    :
                    ""
                  }

                </td>


                <td>

                  <span
                    class="
                      status
                      ${statusClass(
                        item.status
                      )}
                    "
                  >

                    ${escapeHTML(
                      item.status
                    )}

                  </span>

                </td>


                <td>

                  <button
                    class="edit-btn"
                    onclick="
                      editTask(
                        '${item.id}'
                      )
                    "
                  >
                    ✎
                  </button>

                </td>

              </tr>

            `;

          }).join("")}

          </tbody>

        </table>

      </div>

    `;


    tracker.appendChild(
      section
    );

  });

}

</script>

</body>
</html>
