<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Journalism Asm1 Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f7f7f5;
  color: #292929;
}

.container {
  width: 94%;
  max-width: 1250px;
  margin: 35px auto;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  gap: 15px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  color: #888;
  font-size: 13px;
  margin-top: 5px;
}

.add-btn {
  background: #2f3437;
  color: white;
  border: none;
  padding: 11px 18px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 600;
}

/* TABS */

.view-tabs {
  display: flex;
  gap: 25px;
  margin-bottom: 22px;
  border-bottom: 1px solid #e5e5e5;
}

.tab {
  background: none;
  border: none;
  padding: 10px 4px;
  cursor: pointer;
  color: #777;
  font-size: 13px;
  border-bottom: 2px solid transparent;
}

.tab.active {
  color: #222;
  border-bottom: 2px solid #222;
}

/* STATS */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 18px;
}

.stat-card {
  background: white;
  border: 1px solid #ececec;
  border-radius: 9px;
  padding: 17px 20px;
}

.stat-number {
  font-size: 27px;
  font-weight: 600;
  margin-bottom: 3px;
}

.stat-label {
  font-size: 10px;
  letter-spacing: .7px;
  color: #999;
  text-transform: uppercase;
}

.stat-completed .stat-number {
  color: #4f8460;
}

.stat-due .stat-number {
  color: #a87820;
}

.stat-overdue .stat-number {
  color: #c65959;
}

/* FILTER */

.filters {
  background: white;
  border: 1px solid #ececec;
  border-radius: 9px;
  padding: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
  align-items: center;
}

.filters select,
.filters input {
  width: auto;
  min-width: 135px;
  padding: 8px 10px;
  border: 1px solid #e1e1e1;
  border-radius: 6px;
  background: white;
  font-size: 12px;
}

.clear-btn {
  border: none;
  background: #efefed;
  padding: 8px 13px;
  border-radius: 6px;
  cursor: pointer;
}

.filter-count {
  margin-left: auto;
  color: #999;
  font-size: 11px;
}

/* SECTIONS */

.section {
  background: white;
  border-radius: 9px;
  margin-bottom: 22px;
  border: 1px solid #ececec;
  overflow: hidden;
}

.section-header {
  padding: 15px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  background: #fafafa;
}

.section-title-area {
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
}

.task-count,
.section-progress {
  font-size: 11px;
  color: #999;
}

.arrow {
  font-size: 12px;
  color: #777;
}

.section-content {
  overflow-x: auto;
}

/* TABLE */

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th {
  text-align: left;
  padding: 11px 18px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #8b8b8b;
  border-bottom: 1px solid #eee;
}

td {
  padding: 14px 18px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
  vertical-align: top;
}

tr:last-child td {
  border-bottom: none;
}

.task-name {
  font-weight: 600;
  margin-bottom: 4px;
}

/* NOTE */

.task-note {
  color: #929292;
  font-size: 11px;
  line-height: 1.45;
  max-width: 390px;
  white-space: pre-wrap;
}

/* DATE */

.date-main {
  display: inline-block;
  margin-right: 7px;
}

.deadline-badge {
  display: inline-block;
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 10px;
  white-space: nowrap;
}

.overdue {
  background: #fde8e7;
  color: #b64c46;
}

.due-soon {
  background: #fff2d5;
  color: #8c6a22;
}

.due-normal {
  background: #f1f1ef;
  color: #777;
}

.done-date {
  background: #e8f3ea;
  color: #4d7655;
}

/* STATUS */

.status {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 11px;
  white-space: nowrap;
}

.not-started {
  background: #eeeeec;
  color: #666;
}

.in-progress {
  background: #fff0bd;
  color: #7c621b;
}

.completed {
  background: #dfeee2;
  color: #4b7154;
}

.edit-btn {
  border: none;
  background: transparent;
  cursor: pointer;
  color: #777;
  font-size: 16px;
}

/* PIC CHECKBOX */

.pic-checkbox-box {
  border: 1px solid #ddd;
  border-radius: 7px;
  padding: 10px 12px;
  max-height: 220px;
  overflow-y: auto;
}

.pic-checkbox-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
  font-size: 13px;
  cursor: pointer;
}

.pic-checkbox-item input {
  width: auto !important;
  margin: 0;
}

.pic-all {
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid #eee;
  font-weight: 600;
}

/* CALENDAR */

.calendar-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  gap: 12px;
  flex-wrap: wrap;
}

.calendar-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.calendar-toolbar button,
.calendar-toolbar select {
  padding: 7px 10px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 5px;
  cursor: pointer;
}

#calendarMonth {
  min-width: 150px;
  text-align: center;
}

.calendar-wrapper {
  overflow-x: auto;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(120px, 1fr));
  min-width: 840px;
}

.calendar-days div {
  background: #2f3d57;
  color: white;
  padding: 10px;
  text-align: center;
  font-size: 11px;
}

.calendar-cell {
  min-height: 120px;
  background: white;
  border-right: 1px solid #eee;
  border-bottom: 1px solid #eee;
  padding: 7px;
}

.calendar-cell:nth-child(7n+1) {
  border-left: 1px solid #eee;
}

.calendar-date {
  font-size: 11px;
  color: #777;
  margin-bottom: 6px;
}

.calendar-today .calendar-date {
  background: #e7c95c;
  color: #222;
  display: inline-flex;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  justify-content: center;
  align-items: center;
}

.calendar-task {
  font-size: 10px;
  margin-bottom: 4px;
  padding: 5px 6px;
  border-radius: 4px;
  cursor: pointer;
  line-height: 1.3;
}

.calendar-task.completed {
  background: #dceee1;
  color: #4b7154;
}

.calendar-task.in-progress {
  background: #fff0bd;
  color: #7c621b;
}

.calendar-task.not-started {
  background: #efefef;
  color: #555;
}

.calendar-task-pic {
  opacity: .75;
  font-size: 9px;
}

.calendar-empty {
  background: #fafafa;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 460px;
  padding: 25px;
  border-radius: 12px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-box h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 16px;
  margin-bottom: 5px;
  font-size: 12px;
  color: #555;
}

.modal-box input,
.modal-box select,
.modal-box textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-family: inherit;
}

.modal-box textarea {
  min-height: 75px;
  resize: vertical;
}

.modal-buttons {
  display: flex;
  gap: 9px;
  margin-top: 25px;
  justify-content: flex-end;
}

.modal-buttons button {
  padding: 9px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.save-btn {
  background: #2f3437;
  color: white;
}

.cancel-btn {
  background: #eee;
}

.delete-btn {
  background: #fde6e6;
  color: #b23030;
  margin-right: auto;
}

.empty {
  padding: 30px;
  color: #888;
  background: white;
  border-radius: 8px;
}

@media(max-width: 750px) {

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .header h1 {
    font-size: 22px;
  }

  .filters select,
  .filters input {
    width: calc(50% - 5px);
    min-width: 0;
  }

  .filter-count {
    width: 100%;
    margin-left: 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <h1>Online Journalism Asm1</h1>
      <div class="subtitle">Assignment Task Tracker</div>
    </div>

    <button class="add-btn" onclick="openAddModal()">
      + Add Task
    </button>
  </div>


  <div class="view-tabs">

    <button
      class="tab active"
      id="tasksTab"
      onclick="showTasksView()"
    >
      Tasks
    </button>

    <button
      class="tab"
      id="calendarTab"
      onclick="showCalendarView()"
    >
      Calendar
    </button>

  </div>


  <div id="tasksView">

    <div class="stats">

      <div class="stat-card">
        <div class="stat-number" id="totalTasks">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>

      <div class="stat-card stat-completed">
        <div class="stat-number" id="completedTasks">0</div>
        <div class="stat-label">Completed</div>
      </div>

      <div class="stat-card stat-due">
        <div class="stat-number" id="dueSoonTasks">0</div>
        <div class="stat-label">Due Within 7 Days</div>
      </div>

      <div class="stat-card stat-overdue">
        <div class="stat-number" id="overdueTasks">0</div>
        <div class="stat-label">Overdue</div>
      </div>

    </div>


    <div class="filters">

      <select id="departmentFilter" onchange="render()">
        <option value="">All Departments</option>
      </select>

      <select id="picFilter" onchange="render()">
        <option value="">All PIC</option>
      </select>

      <select id="statusFilter" onchange="render()">
        <option value="">All Status</option>
        <option value="Not Started">Not Started</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>

      <input type="date" id="fromDate" onchange="render()">
      <input type="date" id="toDate" onchange="render()">

      <button class="clear-btn" onclick="clearFilters()">
        Clear
      </button>

      <span class="filter-count" id="filterCount"></span>

    </div>

    <div id="tracker">
      Loading...
    </div>

  </div>


  <div id="calendarView" style="display:none">

    <div class="calendar-toolbar">

      <div class="calendar-controls">

        <button onclick="changeMonth(-1)">‹</button>

        <strong id="calendarMonth"></strong>

        <button onclick="changeMonth(1)">›</button>

        <button onclick="goToday()">Today</button>

      </div>

      <select
        id="calendarDepartmentFilter"
        onchange="renderCalendar()"
      >
        <option value="">All Departments</option>
      </select>

    </div>

    <div class="calendar-wrapper">

      <div class="calendar-grid calendar-days">
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
        <div>Sun</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

    </div>

  </div>

</div>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">Add Task</h2>


    <label>Department / Section</label>
    <input
      id="department"
      placeholder="e.g. Due Date"
    >


    <label>Task</label>
    <input
      id="task"
      placeholder="e.g. Group Consultation - 12pm"
    >


    <label>Note</label>
    <textarea
      id="note"
      placeholder="Add details or reminders..."
    ></textarea>


    <label>PIC</label>

    <div
      id="picCheckboxes"
      class="pic-checkbox-box"
    ></div>


    <label>Date</label>
    <input type="date" id="due">


    <label>Status</label>

    <select id="status">
      <option value="Not Started">Not Started</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
    </select>


    <div class="modal-buttons">

      <button
        class="delete-btn"
        id="deleteButton"
        onclick="deleteTask()"
        style="display:none"
      >
        Delete
      </button>

      <button
        class="cancel-btn"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="save-btn"
        onclick="saveTask()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDZ3oh1Adjnz_-d5MMJj8vBSWHZQGfkx3I",
  authDomain: "online-journalism-asm1.firebaseapp.com",
  projectId: "online-journalism-asm1",
  storageBucket: "online-journalism-asm1.firebasestorage.app",
  messagingSenderId: "742635372867",
  appId: "1:742635372867:web:e4b0b33cc5aae5b583aff6",
  measurementId: "G-H88Z242G80"
};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const tasksCollection =
  collection(db, "tasks");


let tasks = [];
let editingID = null;
let calendarDate = new Date();


/* PIC LIST */

const PIC_LIST = [
  "changyi",
  "lisa",
  "rain",
  "xinyue",
  "cass",
  "shayne",
  "yy"
];


/* HELPERS */

function escapeHTML(value) {

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function normalisePICs(pic) {

  if (Array.isArray(pic))
    return pic;

  return (pic || "")
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);
}


function displayPICs(pic) {

  const pics =
    normalisePICs(pic);

  return pics.length
    ? pics.join(", ")
    : "—";
}


/* PIC CHECKBOX */

function renderPICCheckboxes(selectedPICs = []) {

  const box =
    document.getElementById("picCheckboxes");

  box.innerHTML = "";


  const allRow =
    document.createElement("label");

  allRow.className =
    "pic-checkbox-item pic-all";

  allRow.innerHTML = `
    <input type="checkbox" id="picAll">
    All
  `;

  box.appendChild(allRow);


  PIC_LIST.forEach(name => {

    const row =
      document.createElement("label");

    row.className =
      "pic-checkbox-item";

    row.innerHTML = `
      <input
        type="checkbox"
        class="pic-person"
        value="${escapeHTML(name)}"
      >
      ${escapeHTML(name)}
    `;

    box.appendChild(row);

  });


  const allCheckbox =
    document.getElementById("picAll");

  const people =
    [...document.querySelectorAll(".pic-person")];


  people.forEach(checkbox => {

    checkbox.checked =
      selectedPICs.includes(
        checkbox.value
      );

  });


  updateAllCheckbox();


  allCheckbox.addEventListener(
    "change",
    function() {

      people.forEach(checkbox => {

        checkbox.checked =
          allCheckbox.checked;

      });

    }
  );


  people.forEach(checkbox => {

    checkbox.addEventListener(
      "change",
      updateAllCheckbox
    );

  });

}


function updateAllCheckbox() {

  const allCheckbox =
    document.getElementById("picAll");

  const people =
    [...document.querySelectorAll(".pic-person")];


  if (!allCheckbox)
    return;


  allCheckbox.checked =
    people.length > 0 &&
    people.every(
      checkbox =>
      checkbox.checked
    );

}


function getSelectedPICs() {

  return [
    ...document.querySelectorAll(
      ".pic-person:checked"
    )
  ]
  .map(
    checkbox =>
    checkbox.value
  );

}


/* LIVE FIREBASE */

onSnapshot(

  tasksCollection,

  snapshot => {

    tasks = [];

    snapshot.forEach(item => {

      tasks.push({
        id: item.id,
        ...item.data()
      });

    });

    updateFilters();
    updateCalendarDepartmentFilter();
    updateStats();
    render();

    if (
      document
      .getElementById("calendarView")
      .style.display !== "none"
    ) {
      renderCalendar();
    }

  },

  error => {

    console.error(error);

    document
    .getElementById("tracker")
    .innerHTML = `
      <div class="empty">
        Unable to load tasks.
      </div>
    `;

  }

);


/* VIEW */

window.showTasksView =
function() {

  document.getElementById("tasksView")
    .style.display = "block";

  document.getElementById("calendarView")
    .style.display = "none";

  document.getElementById("tasksTab")
    .classList.add("active");

  document.getElementById("calendarTab")
    .classList.remove("active");

};


window.showCalendarView =
function() {

  document.getElementById("tasksView")
    .style.display = "none";

  document.getElementById("calendarView")
    .style.display = "block";

  document.getElementById("calendarTab")
    .classList.add("active");

  document.getElementById("tasksTab")
    .classList.remove("active");

  renderCalendar();

};


/* STATS */

function updateStats() {

  let completed = 0;
  let dueSoon = 0;
  let overdue = 0;

  const today =
    new Date();

  today.setHours(0,0,0,0);


  tasks.forEach(item => {

    if (item.status === "Completed") {

      completed++;
      return;

    }

    if (!item.due)
      return;


    const due =
      new Date(
        item.due +
        "T00:00:00"
      );


    const days =
      Math.round(
        (due - today) /
        86400000
      );


    if (days < 0)
      overdue++;

    else if (days <= 7)
      dueSoon++;

  });


  document.getElementById("totalTasks")
    .textContent =
    tasks.length;

  document.getElementById("completedTasks")
    .textContent =
    completed;

  document.getElementById("dueSoonTasks")
    .textContent =
    dueSoon;

  document.getElementById("overdueTasks")
    .textContent =
    overdue;

}


/* FILTER OPTIONS */

function updateFilters() {

  const departmentSelect =
    document.getElementById("departmentFilter");

  const picSelect =
    document.getElementById("picFilter");


  const currentDept =
    departmentSelect.value;

  const currentPic =
    picSelect.value;


  const departments =
    [...new Set(
      tasks
      .map(t => t.department)
      .filter(Boolean)
    )].sort();


  departmentSelect.innerHTML =
    `<option value="">All Departments</option>` +
    departments
    .map(d =>
      `<option value="${escapeHTML(d)}">
        ${escapeHTML(d)}
      </option>`
    )
    .join("");


  picSelect.innerHTML =
    `<option value="">All PIC</option>` +
    PIC_LIST
    .map(p =>
      `<option value="${escapeHTML(p)}">
        ${escapeHTML(p)}
      </option>`
    )
    .join("");


  departmentSelect.value =
    currentDept;

  picSelect.value =
    currentPic;

}


window.clearFilters =
function() {

  document.getElementById("departmentFilter").value = "";
  document.getElementById("picFilter").value = "";
  document.getElementById("statusFilter").value = "";
  document.getElementById("fromDate").value = "";
  document.getElementById("toDate").value = "";

  render();

};


/* ADD */

window.openAddModal =
function() {

  editingID = null;

  document.getElementById("modalTitle")
    .textContent =
    "Add Task";

  document.getElementById("deleteButton")
    .style.display =
    "none";

  document.getElementById("department").value = "";
  document.getElementById("task").value = "";
  document.getElementById("note").value = "";
  document.getElementById("due").value = "";
  document.getElementById("status").value = "Not Started";

  renderPICCheckboxes([]);

  document.getElementById("modal")
    .style.display =
    "flex";

};


/* EDIT */

window.editTask =
function(id) {

  const item =
    tasks.find(
      task =>
      task.id === id
    );

  if (!item)
    return;


  editingID = id;


  document.getElementById("modalTitle")
    .textContent =
    "Edit Task";

  document.getElementById("deleteButton")
    .style.display =
    "block";

  document.getElementById("department")
    .value =
    item.department || "";

  document.getElementById("task")
    .value =
    item.task || "";

  document.getElementById("note")
    .value =
    item.note || "";

  document.getElementById("due")
    .value =
    item.due || "";

  document.getElementById("status")
    .value =
    item.status || "Not Started";


  renderPICCheckboxes(
    normalisePICs(item.pic)
  );


  document.getElementById("modal")
    .style.display =
    "flex";

};


/* SAVE */

window.saveTask =
async function() {

  const department =
    document.getElementById("department")
    .value.trim();

  const task =
    document.getElementById("task")
    .value.trim();

  const note =
    document.getElementById("note")
    .value.trim();

  const pic =
    getSelectedPICs();

  const due =
    document.getElementById("due")
    .value;

  const status =
    document.getElementById("status")
    .value;


  if (!department) {

    alert("Please enter a department.");
    return;

  }


  if (!task) {

    alert("Please enter a task.");
    return;

  }


  const data = {
    department,
    task,
    note,
    pic,
    due,
    status
  };


  try {

    if (editingID) {

      await updateDoc(

        doc(
          db,
          "tasks",
          editingID
        ),

        data

      );

    }

    else {

      data.createdAt =
        serverTimestamp();

      await addDoc(
        tasksCollection,
        data
      );

    }


    closeModal();

  }

  catch(error) {

    console.error(error);
    alert("Unable to save task.");

  }

};


/* DELETE */

window.deleteTask =
async function() {

  if (!editingID)
    return;


  if (!confirm("Delete this task?"))
    return;


  try {

    await deleteDoc(

      doc(
        db,
        "tasks",
        editingID
      )

    );

    closeModal();

  }

  catch(error) {

    console.error(error);
    alert("Unable to delete task.");

  }

};


/* CLOSE */

window.closeModal =
function() {

  document.getElementById("modal")
    .style.display =

};

.addEventListener(
  "click",

  }
);


/* DEADLINE */

function getDeadline(dueDate,status) {

  if (!dueDate)
    return {
      text:"",
      className:""
    };


  if (status === "Completed")
    return {
      text:"Completed",
      className:"done-date"
    };


  const today =
    new Date();

  today.setHours(0,0,0,0);


  const due =
    new Date(
      dueDate +
      "T00:00:00"
    );


  const days =
    Math.round(
      (due - today) /
      86400000
    );


  if (days < 0)
    return {
      text:
      "⚠ " +
      Math.abs(days) +
      "d overdue",
      className:"overdue"
    };


  if (days === 0)
    return {
      text:"⚠ Due today",
      className:"overdue"
    };


  if (days <= 7)
    return {
      text:"Due in " + days + "d",
      className:"due-soon"
    };


  return {
    text:"Due in " + days + "d",
    className:"due-normal"
  };

}


function formatDate(dateString) {

  if (!dateString)
    return "—";


  const date =
    new Date(
      dateString +
      "T00:00:00"
    );


  return date.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}


function statusClass(status) {

  if (status === "Completed")
    return "completed";

  if (status === "In Progress")
    return "in-progress";

  return "not-started";

}


/* COLLAPSE */

window.toggleSection =
function(id) {

  const content =
    document.getElementById(id);

  content.style.display =
    content.style.display === "none"
    ? "block"
    : "none";

};


/* TASK RENDER */

window.render =
function() {

  const tracker =
    document.getElementById("tracker");


  const departmentFilter =
    document.getElementById("departmentFilter").value;

  const picFilter =
    document.getElementById("picFilter").value;

  const statusFilter =
    document.getElementById("statusFilter").value;

  const fromDate =
    document.getElementById("fromDate").value;

  const toDate =
    document.getElementById("toDate").value;


  let filtered =
    tasks.filter(item => {

      if (
        departmentFilter &&
        item.department !== departmentFilter
      )
        return false;


      if (picFilter) {

        const pics =
          normalisePICs(item.pic);

        if (!pics.includes(picFilter))
          return false;

      }


      if (
        statusFilter &&
        item.status !== statusFilter
      )
        return false;


      if (
        fromDate &&
        (!item.due || item.due < fromDate)
      )
        return false;


      if (
        toDate &&
        (!item.due || item.due > toDate)
      )
        return false;


      return true;

    });


  document.getElementById("filterCount")
    .textContent =
    filtered.length +
    " of " +
    tasks.length +
    " tasks shown";


  filtered.sort((a,b) => {

    if (!a.due && !b.due)
      return 0;

    if (!a.due)
      return 1;

    if (!b.due)
      return -1;

    return a.due.localeCompare(b.due);

  });


  if (!filtered.length) {

    tracker.innerHTML = `
      <div class="empty">
        No tasks match the selected filters.
      </div>
    `;

    return;

  }


  const departments = {};


  filtered.forEach(item => {

    const department =
      item.department || "General";

    if (!departments[department])
      departments[department] = [];

    departments[department].push(item);

  });


  tracker.innerHTML = "";


  Object.keys(departments)
  .forEach((department,index) => {

    const sectionTasks =
      departments[department];

    const completed =
      sectionTasks.filter(
        task =>
        task.status === "Completed"
      ).length;

    const percentage =
      Math.round(
        completed /
        sectionTasks.length *
        100
      );

    const id =
      "section-" + index;

    const section =
      document.createElement("div");

    section.className =
      "section";


    section.innerHTML = `

      <div
        class="section-header"
        onclick="toggleSection('${id}')"
      >

        <div class="section-title-area">

          <span class="arrow">▾</span>

          <span class="section-title">
            ${escapeHTML(department)}
          </span>

          <span class="task-count">
            ${sectionTasks.length} tasks
          </span>

        </div>

        <div class="section-progress">
          ${percentage}%
        </div>

      </div>


      <div
        class="section-content"
        id="${id}"
      >

        <table>

          <thead>
            <tr>
              <th style="width:38%">TASK</th>
              <th style="width:22%">PIC</th>
              <th style="width:22%">DATES</th>
              <th style="width:15%">STATUS</th>
              <th></th>
            </tr>
          </thead>

          <tbody>

          ${sectionTasks.map(item => {

            const deadline =
              getDeadline(
                item.due,
                item.status
              );

            return `

              <tr>

                <td>

                  <div class="task-name">
                    ${escapeHTML(item.task)}
                  </div>

                  ${
                    item.note
                    ?
                    `
                    <div class="task-note">
                      ${escapeHTML(item.note)}
                    </div>
                    `
                    :
                    ""
                  }

                </td>


                <td>
                  ${escapeHTML(
                    displayPICs(item.pic)
                  )}
                </td>


                <td>

                  <span class="date-main">
                    ${formatDate(item.due)}
                  </span>

                  ${
                    deadline.text
                    ?
                    `
                    <span
                      class="
                        deadline-badge
                        ${deadline.className}
                      "
                    >
                      ${escapeHTML(deadline.text)}
                    </span>
                    `
                    :
                    ""
                  }

                </td>


                <td>

                  <span
                    class="
                      status
                      ${statusClass(item.status)}
                    "
                  >
                    ${escapeHTML(
                      item.status || "Not Started"
                    )}
                  </span>

                </td>


                <td>

                  <button
                    class="edit-btn"
                    onclick="editTask('${item.id}')"
                  >
                    ✎
                  </button>

                </td>

              </tr>

            `;

          }).join("")}

          </tbody>

        </table>

      </div>

    `;


    tracker.appendChild(section);

  });

};


/* CALENDAR DEPARTMENT */

function updateCalendarDepartmentFilter() {

  const select =
    document.getElementById(
      "calendarDepartmentFilter"
    );

  const current =
    select.value;

  const departments =
    [...new Set(
      tasks
      .map(t => t.department)
      .filter(Boolean)
    )].sort();


  select.innerHTML =
    `<option value="">All Departments</option>` +
    departments
    .map(d =>
      `<option value="${escapeHTML(d)}">
        ${escapeHTML(d)}
      </option>`
    )
    .join("");


  select.value =
    current;

}


/* CALENDAR CONTROLS */

window.changeMonth =
function(amount) {

  calendarDate =
    new Date(
      calendarDate.getFullYear(),
      calendarDate.getMonth() + amount,
      1
    );

  renderCalendar();

};


window.goToday =
function() {

  calendarDate =
    new Date();

  renderCalendar();

};


/* CALENDAR */

window.renderCalendar =
function() {

  const grid =
    document.getElementById("calendarGrid");

  const title =
    document.getElementById("calendarMonth");

  const filter =
    document.getElementById(
      "calendarDepartmentFilter"
    ).value;


  const year =
    calendarDate.getFullYear();

  const month =
    calendarDate.getMonth();


  title.textContent =
    calendarDate.toLocaleDateString(
      "en-US",
      {
        month:"long",
        year:"numeric"
      }
    );


  const firstDay =
    new Date(year,month,1);

  const lastDay =
    new Date(year,month+1,0);


  let startDay =
    firstDay.getDay();

  startDay =
    startDay === 0
    ? 6
    : startDay - 1;


  const daysInMonth =
    lastDay.getDate();


  grid.innerHTML = "";


  for (
    let i = 0;
    i < startDay;
    i++
  ) {

    const empty =
      document.createElement("div");

    empty.className =
      "calendar-cell calendar-empty";

    grid.appendChild(empty);

  }


  const today =
    new Date();

  const todayString =
    `${today.getFullYear()}-${String(
      today.getMonth()+1
    ).padStart(2,"0")}-${String(
      today.getDate()
    ).padStart(2,"0")}`;


  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const cell =
      document.createElement("div");

    cell.className =
      "calendar-cell";


    const dateString =
      `${year}-${String(
        month+1
      ).padStart(2,"0")}-${String(
        day
      ).padStart(2,"0")}`;


    if (dateString === todayString)
      cell.classList.add(
        "calendar-today"
      );


    cell.innerHTML =
      `<div class="calendar-date">
        ${day}
      </div>`;


    const dayTasks =
      tasks.filter(task => {

        if (task.due !== dateString)
          return false;

        if (
          filter &&
          task.department !== filter
        )
          return false;

        return true;

      });


    dayTasks.forEach(task => {

      const taskBox =
        document.createElement("div");

      taskBox.className =
        "calendar-task " +
        statusClass(task.status);


      const pics =
        normalisePICs(task.pic)
        .join(", ");


      taskBox.innerHTML = `

        <strong>
          ${escapeHTML(task.task)}
        </strong>

        ${
          pics
          ?
          `
          <br>
          <span class="calendar-task-pic">
            ${escapeHTML(pics)}
          </span>
          `
          :
          ""
        }

      `;


      taskBox.onclick =
        () => editTask(task.id);


      cell.appendChild(taskBox);

    });


    grid.appendChild(cell);

  }

};

</script>
